<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghar Jaisa – Login</title>

<style>
:root{
  --accent:#8B4513;
  --accent2:#ffdd9e;
  --bg-light:#f5f3ef;
  --card-light:#ffffffcc;
  --card-dark:#1c1c1ccc;
  --shadow-light:0 12px 40px rgba(0,0,0,0.15);
  --shadow-dark:0 18px 50px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Segoe UI",sans-serif;
  background:var(--bg-light);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  transition:0.35s;
  color:#222;
}
body.dark{
  background:#121212;
  color:#eee;
}

/* NAV */
.nav{
  position:fixed;
  top:0;left:0;right:0;
  padding:20px 60px;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(to bottom,rgba(0,0,0,0.35),rgba(0,0,0,0.15));
  backdrop-filter:blur(10px);
  z-index:1000;
}
.brand{color:var(--accent2);font-weight:800;font-size:22px;}
.nav-links a{
  color:white;
  margin:0 15px;
  text-decoration:none;
  font-weight:600;
}
#themeToggle{
  background:var(--accent2);
  color:#4b2e10;
  padding:8px 16px;
  border:none;
  border-radius:8px;
  font-weight:700;
}

/* LOGIN PAGE */
.login-wrap{
  padding-top:140px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:40px;
}

.card{
  width:340px;
  padding:25px;
  border-radius:18px;
  backdrop-filter:blur(12px);
  transform:translateY(20px);
  opacity:0;
  transition:0.5s;
}
.card.visible{
  opacity:1;
  transform:translateY(0);
}
body:not(.dark) .card{
  background:var(--card-light);
  box-shadow:var(--shadow-light);
}
body.dark .card{
  background:var(--card-dark);
  box-shadow:var(--shadow-dark);
}

.card h2{
  margin-bottom:10px;
  font-size:26px;
  font-weight:800;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  margin:10px 0;
  border:1px solid rgba(0,0,0,0.25);
  background:rgba(255,255,255,0.7);
}

.btn{
  width:100%;
  padding:14px;
  background:var(--accent);
  color:white;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  font-size:18px;
}

/* FOOTER */
.footer{
  background:var(--accent);
  padding:25px;
  color:white;
  text-align:center;
  font-weight:600;
  margin-top:auto;
}
</style>
</head>

<body>

<header class="nav">
  <div class="brand">Ghar Jaisa</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="order.html">Order</a>
    <a href="login.html">Login</a>
  </div>
  <button id="themeToggle">Dark Mode</button>
</header>

<section class="login-wrap">
  
  <div class="card fade">
    <h2>Login</h2>
    <input placeholder="Email">
    <input placeholder="Password" type="password">
    <button class="btn">Login</button>
  </div>

  <div class="card fade">
    <h2>Create Account</h2>
    <input placeholder="Full Name">
    <input placeholder="Email">
    <input placeholder="Password" type="password">
    <button class="btn">Sign Up</button>
  </div>

</section>

<footer class="footer">© 2025 Ghar Jaisa Restaurant</footer>

<script>
// Theme
function applyTheme(){
  if(localStorage.getItem("gj-theme")==="dark") 
    document.body.classList.add("dark");
}
applyTheme();

document.getElementById("themeToggle").onclick=()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("gj-theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
};

// Fade animations
const cards=document.querySelectorAll(".card");
const obs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting)e.target.classList.add("visible");
  });
},{threshold:0.2});
cards.forEach(c=>obs.observe(c));
</script>

</body>
</html>
